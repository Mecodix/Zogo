name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev clang libclang-dev cmake ninja-build pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check
        run: cargo check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Fmt
        run: cargo fmt --check
