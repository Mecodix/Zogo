name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV + toolchain
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && break || sleep 15
          done
          sudo apt-get install -y --no-install-recommends \
            libopencv-dev clang libclang-dev cmake ninja-build pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Fmt
        run: cargo fmt --check
