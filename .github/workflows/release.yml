name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android-arm64:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      OPENCV_LINK_LIBS: opencv_java4
      OPENCV_DISABLE_PROBES: pkg_config,cmake,vcpkg,vcpkg_cmake
    steps:
      - uses: actions/checkout@v4

      - name: Locate preinstalled NDK
        run: |
          ls "$ANDROID_SDK_ROOT/ndk/"
          echo "ANDROID_NDK_HOME=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk + host tools
        run: |
          cargo install cargo-ndk
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake unzip

      - name: OpenCV Android SDK 4.14.0
        run: |
          curl -sL -o /tmp/ocv.zip https://github.com/opencv/opencv/releases/download/4.14.0/opencv-4.14.0-android-sdk.zip
          unzip -q /tmp/ocv.zip -d /tmp/ocv
          LIBFILE="$(find /tmp/ocv -name 'libopencv_java4.so' -path '*arm64-v8a*' | head -1)"
          if [ -z "$LIBFILE" ]; then echo "SDK layout:"; find /tmp/ocv -maxdepth 5 | head -30; exit 1; fi
          LIBDIR="$(dirname "$LIBFILE")"
          OCV_NATIVE="$(dirname "$(dirname "$LIBDIR")")"
          echo "OPENCV_LINK_PATHS=$LIBDIR" >> "$GITHUB_ENV"
          echo "OPENCV_INCLUDE_PATHS=$OCV_NATIVE/jni/include" >> "$GITHUB_ENV"
          echo "OCV_LIBDIR=$LIBDIR" >> "$GITHUB_ENV"
          ls "$LIBDIR" | head

      - name: Build arm64 release
        run: |
          NDKBIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDKBIN:$PATH"
          sudo apt-get install -y --no-install-recommends libc6-dev-i386
          which -a clang | head -3
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export OPENCV_CLANG_ARGS="--target=aarch64-linux-android --sysroot=$SYSROOT"
          export LIBCLANG_PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/lib"
          export LD_LIBRARY_PATH="$LIBCLANG_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo ndk -t arm64-v8a build --release

      - name: Package with shared libs
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/sniper dist/
          cp "$OCV_LIBDIR/libopencv_java4.so" dist/
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android"
          if [ -f "$SYSROOT/libc++_shared.so" ]; then cp "$SYSROOT/libc++_shared.so" dist/; fi
          ls -l dist/
          tar -czf sniper-android-arm64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniper-android-arm64
          path: sniper-android-arm64.tar.gz

      - name: GitHub Release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sniper-android-arm64.tar.gz
